<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Face Pixel Lab</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0b0d12;color:#e8ecf5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;text-align:center}
  h1{font-size:20px;margin:0 0 6px}
  p{font-size:14px;color:#8a93a8;margin:0 0 18px;line-height:1.4}
  .btns{display:flex;gap:10px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
  label,button{background:#5eead4;color:#06231f;border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.4}
  input{display:none}
  .wrap{display:inline-block;background:#000;border-radius:12px;padding:8px;border:1px solid #2a3142}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:240px;height:240px;display:block;border-radius:6px}
  #msg{margin-top:14px;color:#fbbf24;font-size:14px;min-height:20px}
  .hint{margin-top:10px;font-size:12px;color:#5a6478}
</style>
</head>
<body>
<h1>Face Pixel Lab</h1>
<p>Pick a photo. Your face becomes a 48x48 pixel sprite. Tap Save.</p>
<div class="btns">
  <label>Take photo<input id="cam" type="file" accept="image/*" capture="user"></label>
  <label>Choose photo<input id="lib" type="file" accept="image/*"></label>
  <button id="save" disabled>Save sprite</button>
</div>
<div class="wrap"><canvas id="out" width="48" height="48"></canvas></div>
<div id="msg">No photo yet.</div>
<div class="hint">If Save does nothing, screenshot the pixel face.</div>
<script>
const out=document.getElementById('out');
const msg=document.getElementById('msg');
const saveBtn=document.getElementById('save');
const octx=out.getContext('2d');
function setMsg(t){msg.textContent=t}
function clamp(n,a,b){return n<a?a:n>b?b:n}
function pixelate(img){
  const size=48;
  const s=Math.min(img.width,img.height);
  const sx=(img.width-s)/2, sy=(img.height-s)/2;
  const tmp=document.createElement('canvas');
  tmp.width=size*2; tmp.height=size*2;
  const t=tmp.getContext('2d');
  t.drawImage(img,sx,sy,s,s,0,0,size*2,size*2);
  let id=t.getImageData(0,0,tmp.width,tmp.height);
  let min=255,max=0,d=id.data;
  for(let i=0;i<d.length;i+=4){const y=.2*d[i]+.7*d[i+1]+.1*d[i+2]; if(y<min)min=y; if(y>max)max=y;}
  const span=Math.max(1,max-min);
  for(let i=0;i<d.length;i+=4){d[i]=clamp((d[i]-min)*255/span,0,255);d[i+1]=clamp((d[i+1]-min)*255/span,0,255);d[i+2]=clamp((d[i+2]-min)*255/span,0,255);}
  t.putImageData(id,0,0);
  const small=document.createElement('canvas');
  small.width=size; small.height=size;
  const sctx=small.getContext('2d');
  sctx.imageSmoothingEnabled=false;
  sctx.drawImage(tmp,0,0,size,size);
  const sid=sctx.getImageData(0,0,size,size);
  const px=[];
  for(let i=0;i<sid.data.length;i+=4) px.push([sid.data[i],sid.data[i+1],sid.data[i+2]]);
  const boxes=[px];
  while(boxes.length<24){
    let bi=0,br=-1,ax=0;
    boxes.forEach((box,i)=>{
      if(box.length<2) return;
      const mn=[255,255,255],mx=[0,0,0];
      box.forEach(p=>{for(let c=0;c<3;c++){if(p[c]<mn[c])mn[c]=p[c]; if(p[c]>mx[c])mx[c]=p[c];}});
      const r=[mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]];
      const a=r[0]>=r[1]&&r[0]>=r[2]?0:r[1]>=r[2]?1:2;
      if(r[a]>br){br=r[a];bi=i;ax=a;}
    });
    if(br<=0) break;
    const box=boxes[bi].slice().sort((a,b)=>a[ax]-b[ax]);
    const mid=Math.floor(box.length/2);
    boxes.splice(bi,1,box.slice(0,mid),box.slice(mid));
  }
  const pal=boxes.map(box=>{
    const s=[0,0,0]; box.forEach(p=>{s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];});
    return [Math.round(s[0]/box.length),Math.round(s[1]/box.length),Math.round(s[2]/box.length)];
  });
  const dd=sid.data;
  for(let i=0;i<dd.length;i+=4){
    let best=0,bd=1e9;
    for(let p=0;p<pal.length;p++){
      const dr=pal[p][0]-dd[i],dg=pal[p][1]-dd[i+1],db=pal[p][2]-dd[i+2];
      const dist=dr*dr+dg*dg+db*db; if(dist<bd){bd=dist;best=p;}
    }
    dd[i]=pal[best][0]; dd[i+1]=pal[best][1]; dd[i+2]=pal[best][2]; dd[i+3]=255;
  }
  sctx.putImageData(sid,0,0);
  octx.imageSmoothingEnabled=false;
  octx.clearRect(0,0,48,48);
  octx.drawImage(small,0,0);
  saveBtn.disabled=false;
  setMsg('Done. Tap Save sprite.');
}
function load(file){
  if(!file){setMsg('No file.');return;}
  setMsg('Loading…');
  saveBtn.disabled=true;
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);pixelate(img);};
  img.onerror=()=>{
    const r=new FileReader();
    r.onload=()=>{const i2=new Image(); i2.onload=()=>pixelate(i2); i2.onerror=()=>setMsg('Use a screenshot of the photo instead.'); i2.src=r.result;};
    r.readAsDataURL(file);
  };
  img.src=url;
}
document.getElementById('cam').onchange=e=>load(e.target.files[0]);
document.getElementById('lib').onchange=e=>load(e.target.files[0]);
saveBtn.onclick=()=>{
  try{
    out.toBlob(blob=>{
      if(!blob){setMsg('Save failed. Screenshot the face instead.');return;}
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='face-sprite.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setMsg('Saved. Check Downloads or Files.');
    },'image/png');
  }catch(e){
    setMsg('Save failed. Screenshot the face instead.');
  }
};
</script>
</body>
</html>
